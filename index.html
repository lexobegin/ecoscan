<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoScan — ¿A qué basurero va? La IA decide 🍌♻️</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background:#0f1419; color:#e7ecef; display:flex; flex-direction:column;
         align-items:center; padding:16px; min-height:100vh; }
  h1 { font-size:28px; margin-top:8px; }
  .sub { color:#9fb3bd; margin:4px 0 14px; }
  .camara { width:100%; max-width:420px; aspect-ratio:3/4; background:#000;
            border-radius:20px; overflow:hidden; border:3px solid #2b3945; }
  video { width:100%; height:100%; object-fit:cover; }
  .botones, .botones2 { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; justify-content:center; }
  button { background:#22d3a7; color:#06251d; border:none; padding:12px 18px;
           border-radius:12px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.sec { background:#2b3945; color:#e7ecef; }
  .tarjeta { width:100%; max-width:420px; background:#161d23; border:2px solid #2b3945;
             border-radius:20px; padding:18px; text-align:center; margin-top:6px; }
  .tarjeta.org { border-color:#2e7d32; background:#13211a; }
  .tarjeta.rec { border-color:#1565c0; background:#121c2a; }
  #emoji { font-size:64px; line-height:1; }
  #nombre { font-size:26px; font-weight:900; letter-spacing:1px; margin-top:6px; }
  #frase { color:#9fb3bd; margin-top:4px; min-height:22px; }
  .barraFondo { height:12px; background:#0f1419; border-radius:6px; margin-top:12px; overflow:hidden; }
  #barra { height:100%; width:0%; background:linear-gradient(90deg,#22d3a7,#22a7d3); transition:width .3s; }
  #confianza { font-size:13px; color:#9fb3bd; margin-top:6px; }
  .marcador { display:flex; gap:10px; margin-top:14px; }
  .chip { background:#161d23; border:2px solid #2b3945; border-radius:14px;
          padding:10px 16px; font-size:20px; font-weight:bold; }
  .chip.org { border-color:#2e7d32; }
  .chip.rec { border-color:#1565c0; }
  .chip.total { border-color:#f2b705; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
  .tarjeta.pop { animation:pop .35s; }
  #estado { color:#9fb3bd; font-size:14px; margin-top:12px; text-align:center; }
</style>
</head>
<body>
  <h1>🌱 EcoScan</h1>
  <p class="sub">¿A qué basurero va? La IA decide 🍌♻️</p>

  <div class="camara"><video id="video" playsinline muted autoplay></video></div>
  <canvas id="lienzo" style="display:none"></canvas>

  <div class="botones">
    <button id="btnCamara" disabled>▶️ Encender cámara</button>
    <button id="btnGirar" class="sec">🔄 Cambiar cámara</button>
    <button id="btnParar" class="sec">⏹️ Apagar</button>
  </div>

  <div id="resultado" class="tarjeta">
    <div id="emoji">🤔</div>
    <div id="nombre">Apunta a un residuo…</div>
    <div id="frase">La IA está pensando…</div>
    <div class="barraFondo"><div id="barra"></div></div>
    <div id="confianza"></div>
  </div>

  <div class="marcador">
    <div class="chip org">🍌 <span id="cOrg">0</span></div>
    <div class="chip rec">♻️ <span id="cRec">0</span></div>
    <div class="chip total">🏆 <span id="cTotal">0</span></div>
  </div>
  <div class="botones2"><button id="btnReset" class="sec">🧹 Reiniciar puntos</button></div>

  <p id="estado">Cargando modelo…</p>

<script>
let modelo = null, inputW = 64, inputH = 64;
let stream = null, facing = "environment", corriendo = false;
let historial = [], ultimaClase = null;
const N_MEDIANA = 7;                       // predicciones para estabilizar
const $ = id => document.getElementById(id);

// ---------- 1) Cargar modelo y detectar tamaño de entrada ----------
async function cargarModelo() {
  try {
    const info = await (await fetch("model.json")).json();
    const capas = info.modelTopology.model_config.config.layers;
    for (const c of capas) {
      const cfg = c.config || {};
      if ((c.class_name || "") === "InputLayer" && Array.isArray(cfg.batch_input_shape)
          && cfg.batch_input_shape.length === 4) {
        inputH = cfg.batch_input_shape[1];
        inputW = cfg.batch_input_shape[2];
      }
    }
  } catch (e) { console.warn("Uso 64x64 por defecto:", e); }

  modelo = await tf.loadLayersModel("https://lexobegin.github.io/ecoscan/model.json");
  console.log(`Entrada del modelo: ${inputW}x${inputH}`);
  $("estado").textContent = `✅ Modelo listo (${inputW}x${inputH}) — enciende la cámara`;
  $("btnCamara").disabled = false;
}

// ---------- 2) Cámara ----------
async function iniciarCamara() {
  detenerCamara();
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: {ideal:1280}, height: {ideal:720} },
      audio: false });
  } catch (e) {
    $("estado").textContent = "❌ Sin acceso a la cámara. Dale permiso (la página debe ser HTTPS).";
    return;
  }
  const video = $("video");
  video.srcObject = stream;
  await video.play();
  video.style.transform = facing === "user" ? "scaleX(-1)" : "none";
  corriendo = true;
  $("btnCamara").disabled = true;
  predecirEnBucle();
}
function detenerCamara() {
  corriendo = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("btnCamara").disabled = false;
}
function cambiarCamara() {
  facing = facing === "environment" ? "user" : "environment";
  if (corriendo) iniciarCamara();
}

// ---------- 3) Predicción en vivo (mediana de 7 para estabilizar) ----------
async function predecirEnBucle() {
  if (!corriendo) return;
  const video = $("video");
  if (video.readyState >= 2 && modelo) {
    const lienzo = $("lienzo");
    lienzo.width = inputW; lienzo.height = inputH;
    const ctx = lienzo.getContext("2d", { willReadFrequently: true });
    if (facing === "user") { ctx.save(); ctx.translate(inputW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, inputW, inputH);
    if (facing === "user") ctx.restore();

    const salida = tf.tidy(() => {
      // Píxeles 0-255 directo: el Rescaling dentro del modelo hace la división
      const img = tf.browser.fromPixels(lienzo, 3).toFloat().expandDims(0);
      return modelo.predict(img);
    });
    const prob = (await salida.data())[0];   // probabilidad de RECICLABLE
    salida.dispose();

    historial.push(prob);
    if (historial.length > N_MEDIANA) historial.shift();
    if (historial.length === N_MEDIANA) {
      const mediana = [...historial].sort((a,b)=>a-b)[3];
      actualizarUI(mediana);
    }
  }
  setTimeout(predecirEnBucle, 250);
}

// ---------- 4) Interfaz + puntos ----------
function actualizarUI(prob) {
  const esRec = prob >= 0.5;
  const clase = esRec ? "rec" : "org";
  $("resultado").className = "tarjeta " + clase;
  $("emoji").textContent  = esRec ? "♻️" : "🍌";
  $("nombre").textContent = esRec ? "RECICLABLE" : "ORGÁNICO";
  $("frase").textContent  = esRec ? "¡Va al basurero de reciclaje! 🧴📦"
                                  : "¡Va al basurero orgánico! 🍌🥬";
  const pct = Math.round((esRec ? prob : 1 - prob) * 100);
  $("barra").style.width = pct + "%";
  $("confianza").textContent = "Seguridad: " + pct + "%";

  if (clase !== ultimaClase) {           // solo suma cuando cambia de clase
    ultimaClase = clase;
    const key = clase === "rec" ? "eco_rec" : "eco_org";
    localStorage.setItem(key, (+localStorage.getItem(key) || 0) + 1);
    mostrarPuntos();
    const t = $("resultado");
    t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop");
  }
}
function mostrarPuntos() {
  const org = +localStorage.getItem("eco_org") || 0;
  const rec = +localStorage.getItem("eco_rec") || 0;
  $("cOrg").textContent = org; $("cRec").textContent = rec;
  $("cTotal").textContent = org + rec;
}
function reiniciarPuntos() {
  localStorage.removeItem("eco_org"); localStorage.removeItem("eco_rec");
  mostrarPuntos();
}

 $("btnCamara").onclick = iniciarCamara;
 $("btnGirar").onclick = cambiarCamara;
 $("btnParar").onclick = () => { detenerCamara(); $("estado").textContent = "⏹️ Cámara apagada"; };
 $("btnReset").onclick = reiniciarPuntos;
mostrarPuntos();
cargarModelo();
</script>
</body>
</html>
