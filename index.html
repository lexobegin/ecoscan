<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>EcoScan — ¿A qué basurero va? La IA decide 🍌♻️</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
  body { background:#0f1419; color:#e7ecef; display:flex; flex-direction:column;
         align-items:center; padding:16px; min-height:100vh; }
  h1 { font-size:28px; margin-top:8px; }
  .sub { color:#9fb3bd; margin:4px 0 14px; }
  .camara { width:100%; max-width:420px; aspect-ratio:3/4; background:#000;
            border-radius:20px; overflow:hidden; border:3px solid #2b3945; }
  video { width:100%; height:100%; object-fit:cover; }
  .botones, .botones2 { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; justify-content:center; }
  button { background:#22d3a7; color:#06251d; border:none; padding:12px 18px;
           border-radius:12px; font-size:15px; font-weight:bold; cursor:pointer; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button.sec { background:#2b3945; color:#e7ecef; }
  .tarjeta { width:100%; max-width:420px; background:#161d23; border:2px solid #2b3945;
             border-radius:20px; padding:18px; text-align:center; margin-top:6px; }
  .tarjeta.org { border-color:#2e7d32; background:#13211a; }
  .tarjeta.rec { border-color:#1565c0; background:#121c2a; }
  #emoji { font-size:64px; line-height:1; }
  #nombre { font-size:26px; font-weight:900; letter-spacing:1px; margin-top:6px; }
  #frase { color:#9fb3bd; margin-top:4px; min-height:22px; }
  .barraFondo { height:12px; background:#0f1419; border-radius:6px; margin-top:12px; overflow:hidden; }
  #barra { height:100%; width:0%; background:linear-gradient(90deg,#22d3a7,#22a7d3); transition:width .3s; }
  #confianza { font-size:13px; color:#9fb3bd; margin-top:6px; }
  .marcador { display:flex; gap:10px; margin-top:14px; }
  .chip { background:#161d23; border:2px solid #2b3945; border-radius:14px;
          padding:10px 16px; font-size:20px; font-weight:bold; }
  .chip.org { border-color:#2e7d32; }
  .chip.rec { border-color:#1565c0; }
  .chip.total { border-color:#f2b705; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.07)} 100%{transform:scale(1)} }
  .tarjeta.pop, .chip.pop { animation:pop .4s; }
  #estado { color:#9fb3bd; font-size:14px; margin-top:12px; text-align:center; min-height:20px; }
</style>
</head>
<body>
  <h1>🌱 EcoScan</h1>
  <p class="sub">¿A qué basurero va? La IA decide 🍌♻️</p>

  <div class="camara"><video id="video" playsinline muted autoplay></video></div>
  <canvas id="lienzo" style="display:none"></canvas>

  <div class="botones">
    <button id="btnCamara" disabled>▶️ Encender cámara</button>
    <button id="btnGirar" class="sec" disabled>🔄 Cambiar cámara</button>
    <button id="btnParar" class="sec" disabled>⏹️ Apagar</button>
    <button id="btnFoto" class="sec" disabled>📁 Probar con foto</button>
  </div>
  <input type="file" id="foto" accept="image/*" style="display:none">

  <div id="resultado" class="tarjeta">
    <div id="emoji">🤔</div>
    <div id="nombre">Apunta a un residuo…</div>
    <div id="frase">La IA está pensando…</div>
    <div class="barraFondo"><div id="barra"></div></div>
    <div id="confianza"></div>
  </div>

  <div class="marcador">
    <div class="chip org" id="chipOrg">🍌 <span id="cOrg">0</span></div>
    <div class="chip rec" id="chipRec">♻️ <span id="cRec">0</span></div>
    <div class="chip total" id="chipTotal">🏆 <span id="cTotal">0</span></div>
  </div>
  <div class="botones2"><button id="btnReset" class="sec">🧹 Reiniciar puntos</button></div>

  <p id="estado">Cargando modelo…</p>

<script>
let modelo = null, inputW = 64, inputH = 64;
let stream = null, facing = "environment", corriendo = false;
let historial = [], ultimaClase = null, ultimaVez = 0;
const N_MEDIANA = 5;
const $ = id => document.getElementById(id);

// ---------- 1) Cargar modelo (mismo proceso que ya te funcionó) ----------
async function cargarModelo() {
  try {
    const info = await (await fetch("model.json")).json();
    try {
      const capas = info.modelTopology.model_config.config.layers;
      for (const c of capas) {
        const cfg = c.config || {};
        if ((c.class_name || "") === "InputLayer" &&
            Array.isArray(cfg.batch_input_shape) && cfg.batch_input_shape.length === 4) {
          inputH = cfg.batch_input_shape[1];
          inputW = cfg.batch_input_shape[2];
        }
      }
    } catch (e) { console.warn("Tamaño por defecto 64x64:", e); }

    let prefijo = "";
    for (const bloque of info.weightsManifest)
      for (const w of bloque.weights) {
        const p = w.name.split("/");
        if (p.length > 2) { prefijo = p[0]; w.name = p.slice(1).join("/"); }
      }
    if (prefijo) console.log("Pesos re-etiquetados (se quitó el prefijo '" + prefijo + "/')");

    const binarios = [];
    for (const bloque of info.weightsManifest)
      for (const ruta of bloque.paths)
        binarios.push(await (await fetch(ruta)).arrayBuffer());
    const total = binarios.reduce((s, b) => s + b.byteLength, 0);
    const weightData = new Uint8Array(total);
    let pos = 0;
    for (const b of binarios) { weightData.set(new Uint8Array(b), pos); pos += b.byteLength; }

    modelo = await tf.loadLayersModel(tf.io.fromMemory({
      modelTopology: info.modelTopology,
      weightSpecs: info.weightsManifest.flatMap(b => b.weights),
      weightData: weightData
    }));
  } catch (e) {
    console.error("Error cargando el modelo:", e);
    $("estado").textContent = "❌ Error cargando el modelo: " + e.message;
    return;
  }
  $("estado").textContent = "✅ Modelo listo (" + inputW + "x" + inputH +
                            ") — backend: " + tf.getBackend();
  $("btnCamara").disabled = false;
  $("btnFoto").disabled = false;
}

// ---------- 2) Dibujo con recorte central (el objeto llena el encuadre) ----------
function dibujarRecortado(fuente, anchoNat, altoNat, espejar) {
  const lienzo = $("lienzo");
  lienzo.width = inputW; lienzo.height = inputH;
  const ctx = lienzo.getContext("2d", { willReadFrequently: true });
  const lado = Math.min(anchoNat, altoNat);
  const sx = (anchoNat - lado) / 2, sy = (altoNat - lado) / 2;
  if (espejar) { ctx.save(); ctx.translate(inputW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(fuente, sx, sy, lado, lado, 0, 0, inputW, inputH);
  if (espejar) ctx.restore();
  return lienzo;
}

async function predecirLienzo() {
  const salida = tf.tidy(() => {
    const img = tf.browser.fromPixels($("lienzo"), 3).toFloat().expandDims(0);
    return modelo.predict(img);
  });
  const prob = (await salida.data())[0];
  salida.dispose();
  return prob;
}

// ---------- 3) Cámara ----------
function actualizarBotones(camaraActiva) {
  $("btnCamara").disabled = camaraActiva || !modelo;
  $("btnParar").disabled  = !camaraActiva;
  $("btnGirar").disabled  = !camaraActiva;
}

async function iniciarCamara() {
  detenerCamara();
  $("btnCamara").disabled = true;
  $("estado").textContent = "📷 Pidiendo permiso de cámara…";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: {ideal:1280}, height: {ideal:720} },
      audio: false });
  } catch (e) {
    $("estado").textContent = "❌ Sin acceso a la cámara (" + e.name + ").";
    actualizarBotones(false);
    return;
  }
  const video = $("video");
  video.srcObject = stream;
  try {
    if (video.readyState < 2)
      await new Promise(r => video.addEventListener("loadeddata", r, {once: true}));
    await video.play();
  } catch (e) { console.warn("Video arrancando:", e.name); }
  video.style.transform = facing === "user" ? "scaleX(-1)" : "none";
  corriendo = true;
  actualizarBotones(true);
  $("estado").textContent = "🎥 Cámara activa — acércate al residuo";
  predecirEnBucle();
}

function detenerCamara() {
  corriendo = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $("video").srcObject = null;
  historial = [];
  actualizarBotones(false);
}

function cambiarCamara() {
  facing = facing === "environment" ? "user" : "environment";
  if (corriendo) iniciarCamara();
}

// ---------- 4) Bucle en vivo: mediana de 5, ciclo rápido ----------
async function predecirEnBucle() {
  if (!corriendo) return;
  const video = $("video");
  if (video.readyState >= 2 && modelo) {
    dibujarRecortado(video, video.videoWidth, video.videoHeight, facing === "user");
    const prob = await predecirLienzo();
    historial.push(prob);
    if (historial.length > N_MEDIANA) historial.shift();
    if (historial.length === N_MEDIANA)
      actualizarUI([...historial].sort((a,b)=>a-b)[Math.floor(N_MEDIANA/2)]);
  }
  setTimeout(predecirEnBucle, 150);
}

// ---------- 5) Foto subida (diagnóstico directo contra Colab) ----------
 $("btnFoto").onclick = () => $("foto").click();
 $("foto").onchange = (e) => {
  const archivo = e.target.files[0];
  if (!archivo || !modelo) return;
  const img = new Image();
  img.onload = async () => {
    dibujarRecortado(img, img.naturalWidth, img.naturalHeight, false);
    const prob = await predecirLienzo();
    actualizarUI(prob);
    $("estado").textContent = "📁 Foto analizada — compárala con el resultado de Colab";
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(archivo);
  e.target.value = "";
};

// ---------- 6) Interfaz + puntos (con memoria corregida) ----------
function actualizarUI(prob) {
  const esRec = prob >= 0.5;
  const clase = esRec ? "rec" : "org";
  $("resultado").className = "tarjeta " + clase;
  $("emoji").textContent  = esRec ? "♻️" : "🍌";
  $("nombre").textContent = esRec ? "RECICLABLE" : "ORGÁNICO";
  $("frase").textContent  = esRec ? "¡Va al basurero de reciclaje! 🧴📦"
                                  : "¡Va al basurero orgánico! 🍌🥬";
  const pct = Math.round((esRec ? prob : 1 - prob) * 100);
  $("barra").style.width = pct + "%";
  $("confianza").textContent = "Seguridad: " + pct + "%";

  // +1 cada vez que la IA cambia de clasificación (objeto nuevo)
  if (clase !== ultimaClase && Date.now() - ultimaVez > 1000) {
    ultimaClase = clase;
    ultimaVez = Date.now();
    const key = clase === "rec" ? "eco_rec" : "eco_org";
    localStorage.setItem(key, (+localStorage.getItem(key) || 0) + 1);
    mostrarPuntos();
    const chip = clase === "rec" ? $("chipRec") : $("chipOrg");
    chip.classList.remove("pop"); void chip.offsetWidth; chip.classList.add("pop");
  }
}
function mostrarPuntos() {
  const org = +localStorage.getItem("eco_org") || 0;
  const rec = +localStorage.getItem("eco_rec") || 0;
  $("cOrg").textContent = org; $("cRec").textContent = rec;
  $("cTotal").textContent = org + rec;
}
function reiniciarPuntos() {
  localStorage.removeItem("eco_org");
  localStorage.removeItem("eco_rec");
  ultimaClase = null; ultimaVez = 0; historial = [];
  mostrarPuntos();
}

 $("btnCamara").onclick = iniciarCamara;
 $("btnGirar").onclick = cambiarCamara;
 $("btnParar").onclick = () => { detenerCamara(); $("estado").textContent = "⏹️ Cámara apagada"; };
 $("btnReset").onclick = reiniciarPuntos;
mostrarPuntos();
cargarModelo();
</script>
</body>
</html>
